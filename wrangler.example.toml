# Copy to wrangler.toml, then replace the database ID and origin.
name = "z2pl-landing"
pages_build_output_dir = "./public"
compatibility_date = "2026-09-30"

[vars]
ALLOWED_ORIGIN = "https://YOUR-LANDING-HOSTNAME"

[[d1_databases]]
binding = "DB"
database_name = "z2pl-interest"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Secrets: configure through Wrangler or Pages dashboard, NEVER in this file.
# TURNSTILE_SECRET_KEY
# IP_HASH_KEY (at least 32 random characters)

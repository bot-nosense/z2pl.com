name: Feature request
description: Suggest a capability or improvement for your label workflow.
title: "[Feature] "
body:
  - type: textarea
    id: workflow
    attributes:
      label: Your workflow and the problem
      description: Explain what you are trying to do. Leave out customer data and credentials.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Proposed improvement
      description: Describe the behavior that would help and any alternatives you have tried.
    validations:
      required: true
